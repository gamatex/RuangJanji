<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uji 27 Demo · RuangJanji</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5ebe6;color:#2c221e;font:15px/1.5 system-ui,sans-serif}header{padding:18px 22px;background:#fff8f3;border-bottom:1px solid #decfc5}h1{font-size:22px;margin:0 0 5px}p{margin:0;color:#75645c}main{display:grid;grid-template-columns:minmax(230px,300px) minmax(320px,1fr);gap:20px;padding:20px;max-width:1500px;margin:auto}nav{max-height:calc(100vh - 130px);overflow:auto;background:#fffaf6;border-radius:16px;padding:12px}nav h2{font-size:13px;text-transform:uppercase;margin:12px 10px 4px;color:#907a6d}nav button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:transparent;border-radius:8px;color:inherit;cursor:pointer}nav button[aria-current=true]{background:#c86d51;color:white}section{min-width:0}section .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tools a,.tools button{background:#2c221e;color:white;padding:9px 12px;border:0;border-radius:9px;text-decoration:none;cursor:pointer}.tools button{background:#c86d51}.frame{margin:auto;width:390px;max-width:100%;height:740px;max-height:76vh;border:8px solid #302722;border-radius:28px;overflow:hidden;background:white;box-shadow:0 15px 40px #2c221e30}iframe{width:100%;height:100%;border:0}small{display:block;color:#786a62;margin:10px 0;text-align:center}@media(max-width:750px){main{display:block;padding:10px}nav{max-height:180px;margin-bottom:14px}header{padding:14px}h1{font-size:18px}}
</style></head><body><header><h1>RuangJanji · Pemeriksaan 27 Demo</h1><p>Pratinjau setiap template asli di dalam bingkai ponsel. Pilih template untuk menguji sampul, transisi, audio, dekorasi, galeri, dan RSVP.</p></header>
<main><nav id="templates" aria-label="Daftar template"></nav><section><div class="tools"><strong id="current"></strong><a id="open" target="_blank" rel="noopener">Buka layar penuh</a><button id="reload" type="button">Muat ulang</button></div><div class="frame"><iframe id="preview" title="Demo undangan" loading="eager"></iframe></div><small>Mode pratinjau 390px · Data RSVP tersimpan lokal di browser.</small></section></main>
<script>
const groups={Art:4,Birthday:2,Deluxe:8,Minisite:10,Syari:3};
const nav=document.querySelector('#templates'),frame=document.querySelector('#preview'),open=document.querySelector('#open'),current=document.querySelector('#current');
let selected='';
function show(slug){selected=slug;const url='/templates/'+slug+'.html?to=Contoh%20Tamu';frame.src=url;open.href=url;current.textContent=slug.toUpperCase();nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.slug===slug)));history.replaceState(null,'','#'+slug)}
for(const [category,count] of Object.entries(groups)){const heading=document.createElement('h2');heading.textContent=category;nav.append(heading);for(let i=1;i<=count;i++){const slug=category.toLowerCase()+'-'+String(i).padStart(2,'0'),button=document.createElement('button');button.textContent=slug;button.dataset.slug=slug;button.onclick=()=>show(slug);nav.append(button)}}
document.querySelector('#reload').onclick=()=>{frame.src=frame.src};
const initial=decodeURIComponent(location.hash.slice(1));show(nav.querySelector('button[data-slug="'+initial+'"]')?initial:'art-01');
</script></body></html>
