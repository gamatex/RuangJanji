name: RuangJanji CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and syntax tests
        run: npm test
      - name: Build Cloudflare public assets
        run: npm run build
      - name: Verify packaged pages
        run: |
          test -f dist/apps/buku-tamu/index.html
          test -f dist/apps/ruangjanji/index.html
          test -f dist/invitation.js
          test -f dist/apps/buku-tamu/main.js
          echo "Web build smoke checks passed"
      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: ruangjanji-web-preview
          path: dist/
          retention-days: 7
