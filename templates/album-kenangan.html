@keyframes pw-rise {from {opacity: 0; transform: translateY(16px)} to {opacity: 1; transform: none}}
@keyframes pw-rise-l {from {opacity: 0; transform: translateX(-18px)} to {opacity: 1; transform: none}}
@keyframes pw-rise-r {from {opacity: 0; transform: translateX(18px)} to {opacity: 1; transform: none}}
/* Opened up on Varun's instruction: "way more motion". The prototype's
   amplitudes were a few pixels over twenty-odd seconds, which on a phone held
   at arm's length is motion you can measure and not motion you can see. */
@keyframes pw-drift {from {transform: translateX(-18px)} to {transform: translateX(18px)}}
@keyframes pw-flutter {from {transform: translate(-4px,4px) rotate(-7deg)} to {transform: translate(20px,-16px) rotate(7deg)}}
@keyframes pw-flutter-m {from {transform: scaleX(-1) translate(-4px,4px) rotate(-7deg)} to {transform: scaleX(-1) translate(20px,-16px) rotate(7deg)}}
@keyframes pw-hang {from {transform: rotate(-4.4deg)} to {transform: rotate(4.4deg)}}
@keyframes pw-breathe {from {opacity: .34} to {opacity: .95}}

/* ---- wind ----

   Varun: "give motions to flowers like moving with winds", then: "the way
   flowers moves are not smooth and jittery it shoudl move smoothyl".

   The second note is the more useful of the two, and the fault was mine. The
   first attempt drew the gust with eleven stops - a build, a shove, a second
   shove, a release and a three-step quiver - and a keyframe stop is not a
   waypoint the motion passes through. The easing applies to *each segment*,
   so every one of those eleven was a full stop: the flower reached it, came to
   rest, and set off again. Eleven dead stops in a nine-second loop is exactly
   what juddering is, and no amount of slowing it down would have fixed it,
   because the stops were the shape rather than the speed.

   So: four stops, and the easing is written into the stops themselves rather
   than taken from the shorthand, which lets each segment hand its speed to the
   next instead of parking between them. Only where the flower genuinely turns
   round does it stop, because there it should.

   The turns are at 52% (the far end of the lean) and 78% (the overshoot on the
   way back). Nothing turns at 0%, which is the point easiest to miss and the
   one that makes the loop invisible: the flower is already travelling as it
   passes through upright, so the join between one gust and the next has no
   seam in it.

   translate3d is in every stop and always zero. It is not moving anything -
   it asks the browser to hold the flower on its own layer, so a rotation of
   four degrees on a large watercolour is composited rather than redrawn and
   re-sampled frame by frame, which is its own, finer kind of shimmer.

   The rest is unchanged from the first attempt and still stands. Wind has one
   direction, so every flower leans the same way at the same moment; the sign
   of the rotation depends on where a piece is pinned, because what has to
   travel downwind is the free end. The corner sprays hang from their top
   ("20% 10%", "80% 10%") so a clockwise turn swings their tails *upwind*; the
   sprigs standing on the bottom edge ("50% 100%") are the opposite. Hence two
   curves that look like transposition errors of each other and are not -
   ak-gust for what stands up, ak-gust-h for what hangs down.

   The skew is the bend. A rotation alone pivots a rigid object; a stem in wind
   curves, its tip travelling further than its base, and skewing along the lean
   is what produces that for a flat picture. Its sign follows the same rule and
   for the same reason. */
@keyframes ak-gust {
  0%   {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg); animation-timing-function: cubic-bezier(.38,.1,.38,1)}
  52%  {transform: translate3d(0,0,0) rotate(4.2deg) skewX(-1.5deg); animation-timing-function: cubic-bezier(.5,0,.5,1)}
  78%  {transform: translate3d(0,0,0) rotate(-1.2deg) skewX(.45deg); animation-timing-function: cubic-bezier(.4,0,.5,.78)}
  100% {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg)}
}
@keyframes ak-gust-h {
  0%   {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg); animation-timing-function: cubic-bezier(.38,.1,.38,1)}
  52%  {transform: translate3d(0,0,0) rotate(-4.2deg) skewX(1.5deg); animation-timing-function: cubic-bezier(.5,0,.5,1)}
  78%  {transform: translate3d(0,0,0) rotate(1.2deg) skewX(-.45deg); animation-timing-function: cubic-bezier(.4,0,.5,.78)}
  100% {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg)}
}
/* The long low rows of flowers run the full width of the column, so a degree
   there is worth several of a degree on a corner spray - the same angle in
   pixels is a hedge lurching. Same gust, a third of the travel. */
@keyframes ak-gust-s {
  0%   {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg); animation-timing-function: cubic-bezier(.38,.1,.38,1)}
  52%  {transform: translate3d(0,0,0) rotate(1.5deg) skewX(-.55deg); animation-timing-function: cubic-bezier(.5,0,.5,1)}
  78%  {transform: translate3d(0,0,0) rotate(-.45deg) skewX(.16deg); animation-timing-function: cubic-bezier(.4,0,.5,.78)}
  100% {transform: translate3d(0,0,0) rotate(0deg) skewX(0deg)}
}
/* The arch of blossom over a heading is pinned at neither end, so it takes the
   gust as a whole - shoved sideways and tilted, the way a garland strung
   between two points moves. It turns once, at the far end; the stop on the way
   home is a waypoint it passes through at speed, which is what keeps the
   return from reading as a pendulum. */
@keyframes ak-arch {
  0%   {transform: translate3d(-13px,0,0) rotate(-.7deg); animation-timing-function: cubic-bezier(.34,.12,.4,1)}
  46%  {transform: translate3d(17px,-4px,0) rotate(1.2deg); animation-timing-function: cubic-bezier(.5,0,.62,.72)}
  72%  {transform: translate3d(2px,-1px,0) rotate(.2deg); animation-timing-function: cubic-bezier(.36,.2,.44,1)}
  100% {transform: translate3d(-13px,0,0) rotate(-.7deg)}
}
/* Loose petals already off the stem, so nothing anchors them: the same gust
   carries them across and lifts them, and they tumble a little on the way.
   They cross in one unbroken run and return once, rather than jinking about -
   a scrap of paper in wind travels much further than it wavers. */
@keyframes ak-breeze {
  0%   {transform: translate3d(-24px,6px,0) rotate(-3deg); animation-timing-function: cubic-bezier(.3,.16,.5,.86)}
  44%  {transform: translate3d(10px,-10px,0) rotate(2.5deg); animation-timing-function: cubic-bezier(.3,.14,.4,1)}
  72%  {transform: translate3d(27px,-4px,0) rotate(4.5deg); animation-timing-function: cubic-bezier(.5,0,.5,1)}
  100% {transform: translate3d(-24px,6px,0) rotate(-3deg)}
}

/* ---- falling petals ----

   A scrapbook of pressed flowers, so what moves through it is petals. Three
   lengths of fall so the layer never reads as a loop, each one drifting
   sideways as it goes and turning over on the way down. */
@keyframes ak-fall-a {
  0% {transform: translate3d(0,-14vh,0) rotate(0deg); opacity: 0}
  8% {opacity: var(--ak-petal-o, .5)}
  88% {opacity: var(--ak-petal-o, .5)}
  100% {transform: translate3d(26px,112vh,0) rotate(320deg); opacity: 0}
}
