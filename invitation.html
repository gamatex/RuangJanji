<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undangan | RuangJanji</title><style>body{margin:0;background:#F5EBE6;color:#2C221E;font-family:Georgia,serif}main{max-width:760px;margin:auto;min-height:100vh;text-align:center;padding:48px 20px;box-sizing:border-box}h1{font-size:clamp(34px,8vw,68px);font-weight:normal;color:#C86D51}h2{font-weight:normal}p{line-height:1.8}img{max-width:100%;max-height:450px;border-radius:14px;object-fit:cover}a{color:#C86D51}.hidden{display:none}label{display:block;margin:16px 0;text-align:left}input,select,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d7c7bc;border-radius:12px;margin-top:6px;font:inherit;background:white}button{background:#C86D51;color:white;border:0;border-radius:12px;padding:13px 24px;font:inherit;cursor:pointer}#rsvp-section{margin:38px auto 0;padding:22px;background:#fffaf7;border-radius:20px;max-width:520px}#rsvp-section.hidden{display:none}</style></head><body><main><p>RUANGJANJI</p><section id="loading"><h2>Memuat undangan...</h2></section><section id="invitation" class="hidden"><p>THE WEDDING OF</p><h1 id="names"></h1><img id="photo" class="hidden" alt="Foto mempelai"><h2 id="title"></h2><p id="date"></p><p id="venue"></p><p id="address"></p><p id="story"></p><section id="rsvp-section" class="hidden"><h2>Konfirmasi Kehadiran</h2><p id="rsvp-info">Isi konfirmasi menggunakan tautan undangan pribadi Anda.</p><form id="rsvp-form"><label>Status kehadiran<select id="rsvp-status" required><option value="hadir">Hadir</option><option value="tidak_hadir">Tidak hadir</option><option value="belum">Belum pasti</option></select></label><label>Jumlah hadir<input id="rsvp-attendees" type="number" min="0" max="20" value="1" required></label><label>Ucapan &amp; doa<textarea id="rsvp-wishes" maxlength="1000" rows="4" placeholder="Tulis ucapan untuk kedua mempelai"></textarea></label><button type="submit">Kirim konfirmasi</button><p id="rsvp-message" role="status"></p></form></section></section><section id="missing" class="hidden"><h2>Undangan belum tersedia</h2><p>Alamat tidak ditemukan atau undangan belum dipublikasikan.</p><a href="/">Kembali ke RuangJanji</a></section></main><script type="module" src="/invitation.js"></script></body></html>
