plugins { id 'com.android.application' }
android {
 namespace 'id.ruangjanji.mobile'
 compileSdk 35
 defaultConfig { minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
 flavorDimensions 'app'
 productFlavors {
  ruangjanji { dimension 'app'; applicationId 'id.ruangjanji.customer'; resValue 'string','app_name','RuangJanji'; buildConfigField 'String','APP_URL','"https://ruangjanji.dhjougkyha.workers.dev/apps/ruangjanji/"' }
  bukutamu { dimension 'app'; applicationId 'id.ruangjanji.guestbook'; resValue 'string','app_name','RuangJanji Buku Tamu'; buildConfigField 'String','APP_URL','"https://ruangjanji.dhjougkyha.workers.dev/apps/buku-tamu/"' }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
