@keyframes ts-driftA{0%,100%{transform:translateX(-3.1%)}50%{transform:translateX(4.7%)}}
@keyframes ts-driftB{0%,100%{transform:translateX(3.1%) scaleX(-1)}50%{transform:translateX(-4.7%) scaleX(-1)}}

/*
 * Wind, as one smooth arc.
 *
 * Three degrees either side of upright, and only three keyframes to get there
 * and back. An earlier version weighted the middle of the cycle to imitate a
 * gust - bend out fast, recover slower, with a counter-lean on the way back -
 * and every one of those extra stops is a change of direction the eye reads as
 * a stutter. A single easing from one extreme to the other is what looks like
 * air moving; the variety comes from each piece having its own period and its
 * own head start, not from the shape of the curve.
 */
@keyframes ts-swayA{0%,100%{transform:rotate(-4.7deg)}50%{transform:rotate(4.7deg)}}
@keyframes ts-swayB{0%,100%{transform:rotate(4.7deg)}50%{transform:rotate(-4.7deg)}}
/* Started from the middle, so it is out of step with the two above rather than
   a mirror of them. */
@keyframes ts-swayC{0%,100%{transform:rotate(0deg)}25%{transform:rotate(4.7deg)}75%{transform:rotate(-4.7deg)}}
@keyframes ts-hangA{0%,100%{transform:rotate(4.7deg)}50%{transform:rotate(-4.7deg)}}
@keyframes ts-hangB{0%,100%{transform:rotate(-4.7deg)}50%{transform:rotate(4.7deg)}}
/* The flower band is a whole bank of stems, so it lifts as it leans. */
@keyframes ts-flutter{0%,100%{transform:translateY(0) rotate(-4.7deg)}50%{transform:translateY(-11px) rotate(4.7deg)}}

/*
 * The other half of the motion: the scroll.
 *
 * The loops above are the air in this garden and would run if nobody ever
 * scrolled. These are tied to where the band sits in the viewport instead, so
 * they run backwards when the guest scrolls back up and cost nothing when
 * nobody scrolls at all. Orn composites the two with animation-composition,
 * which is what stops the second simply erasing the first.
 *
 * They live here rather than in src/styles/motion/tatar-sunda.css because the
 * loops beside them are inline styles, and an inline animation shorthand
 * cannot be added to from a stylesheet - a rule would have to overwrite the
 * whole shorthand and every piece's own period with it.
 *
 * Each is symmetric about the position the design draws the piece at, so the
 * middle frame is where it was placed: a piece parked mid-range sits exactly
 * where the handover puts it. Ten degrees and twenty pixels, not four and
 * twelve - the note on these is "clearly visible, not subtle".
 */
@keyframes tsp-lean{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
